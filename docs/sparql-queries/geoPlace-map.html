<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARQL Leaflet Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        #loading { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 4px; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="loading">Loading data from SPARQL endpoint...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Configuration
    const endpoint = "https://humility.lod4hss.cloud/wisski/endpoint/default"; // Adjust if your public endpoint differs
    
    // SPARQL Query
    const query = `
        PREFIX sdh: <https://sdhss.org/ontology/core/>
        PREFIX sdh-short: <https://sdhss.org/ontology/shortcuts/>
        SELECT ?geoPlace ?label ?geoCoord WHERE {
            GRAPH ?g {
                ?geoPlace a sdh:C13 ;
                          sdh-short:P9 ?label ;
                          sdh-short:P15 ?geoCoord .
            }
        }
    `;

    // Initialize Map
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Fetch and Process Data
    async function loadMapData() {
        try {
            const url = `${endpoint}?query=${encodeURIComponent(query)}`;
            const response = await fetch(url, {
                headers: { 'Accept': 'application/sparql-results+json' }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const data = await response.json();
            const bounds = [];

            // Iterate over results
            data.results.bindings.forEach(item => {
                const label = item.label ? item.label.value : 'Unknown Location';
                const wkt = item.geoCoord ? item.geoCoord.value : '';

                // Parse WKT: "POINT (Lon Lat)"
                const match = wkt.match(/POINT\s*\(\s*(-?[\d.]+)\s+(-?[\d.]+)\s*\)/);
                
                if (match) {
                    const lon = parseFloat(match[1]);
                    const lat = parseFloat(match[2]);

                    // Add marker (Leaflet uses Lat, Lon)
                    const marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup(`<b>${label}</b>`);
                    
                    bounds.push([lat, lon]);
                }
            });

            // Fit map to show all markers if any were found
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }

        } catch (error) {
            console.error('Error fetching SPARQL data:', error);
            document.getElementById('loading').innerText = 'Error loading data. Check console.';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // Execute
    loadMapData();
</script>

</body>
</html>

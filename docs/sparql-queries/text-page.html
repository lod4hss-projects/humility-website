<!DOCTYPE html>
<html>

<head>
  <title>Humility-Text</title>
  <link rel="stylesheet" href="base_style.css">

  <!-- manages the enpoint address in just one same place-->
  <script src="address.js"></script>

  <style>
    td {
      vertical-align: top;
      padding: 15px;
      background: #f1f2f3;
    }

    table {
      border-collapse: separate;
      /* Enables spacing */
      border-spacing: 15px 0;
      /* Horizontal spacing between columns, vertical between rows */
       table-layout: fixed; /* Forces strict adherence to width percentages */
      width: 100%;

    }
 
    span {
        display: inline-block; 
        vertical-align: middle; 
        margin-right: 10px;
        line-height: 1; /* Crucial: Prevents extra vertical space from text */
    }

    /* CRITICAL: Reset button defaults that break alignment */
    #button-div button {
        vertical-align: middle;
        margin: 0;
        padding: 4px 8px; /* Explicit padding */
        line-height: 1;
        display: inline-block;
    }


        /* Ensure the link also aligns */
    #button-div + span a {
        vertical-align: middle;
        text-decoration: none;
}
    #tables-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }




    #outoing-section,
    #incoming-section {
      flex: 1;
      min-width: 400px;
      padding: 1%;
      max-width: fit-content;
      background: #e5edef;
    }
  </style>
</head>

<body>
  <div class="entity-header" id="entity-header"></div>
  
  

  <div id="tables-container">
    <div id="chunks-section"> 
      <div id="table-chunks"></div>
      <div class="pagination" id="pagination-chunks"></div>
    </div>


  <div class="pagination" id="pagination"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uri = urlParams.get('uri');
    const decodedURI = decodeURIComponent(uri);

    const endpoint = address;
    const dataGraph = ' GRAPH <https://humility.lod4hss.cloud/resource/>'
    const ontologyGraph = ''
    const originatesFromGraph = 'GRAPH <https://humility.lod4hss.cloud/resource/originatesFrom>'
    const baseFieldsGraph = 'GRAPH <https://humility.lod4hss.cloud/resource/baseFields>'



    if (!uri) {
      document.body.innerHTML = '<p>Error: Missing ?uri parameter.</p>';
      throw new Error('Missing ?uri parameter');
    }

    const pageSize = 10;
    let currentPage = 1;
    let entityName = 'Unknown Entity';
    let entityClass = 'Unknown Class';
    let entityBirthYear = ''

    // this function converts the URI to the elites suisses website URLs
    // according to the class: p, g etc.
    function convertEntityURI(uri) {
      if (typeof uri !== 'string') return null;

      // Pattern 1: pXXXXX → /p/XXXXX
      const pMatch = uri.match(/^https:\/\/humility.lod4hss.cloud\/resource\/([0-9a-f]+)$/)

      // Unknown pattern
      console.warn('URI does not match known patterns:', uri);
      return null;
    }

    // this functions gets the data to write the entity header
    // and builds the correspondent HTML code
    async function fetchEntityInfo() {
      const query = `
      SELECT  ?expressionLabel ?textUri ?text ?translationUri ?translation ?wisskiPageURL
        WHERE {
            BIND( <${uri}> as ?textUri)
            ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                <http://www.cidoc-crm.org/cidoc-crm/P190> ?text;
                <http://www.w3.org/2002/07/owl#sameAs> ?wisskiPageURL.
                
            ## filter that excludes translations and other linguistic objects
            ?expression <http://www.cidoc-crm.org/cidoc-crm/P165> ?textUri;
                a <http://iflastandards.info/ns/lrm/lrmoo/F2>;
                <https://sdhss.org/ontology/shortcuts/P9> ?expressionLabel.
                
            OPTIONAL{
                 <${uri}> <http://www.cidoc-crm.org/cidoc-crm/P73> ?translationUri.
                ?translationUri    <http://www.cidoc-crm.org/cidoc-crm/P190> ?translation.
            }
        }
        LIMIT 1
      `;

      const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/sparql-results+json' }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`Entity info error: ${response.status} ${response.statusText}\n${text}`);
      }

      const data = await response.json();
      const bindings = data.results.bindings;

      if (bindings.length > 0) {
        entityName = bindings[0].expressionLabel?.value || entityName;
        passageText = bindings[0].text?.value || passageText;
        textUri = bindings[0].textUri?.value || textUri;
        wisskiPageURL = bindings[0].wisskiPageURL?.value || textUri;
        translationUri = bindings[0].translationUri?.value || translationUri;
        translation = bindings[0].translation?.value || translation;
      }

      // prepare the Elites Suisses website URL 
      const publicUrl = convertEntityURI(uri);

      // add the entity header 
      // it also adds a button to copy the URL and a link to the Elites Suisses website
      document.getElementById('entity-header').innerHTML = `
        <h3>${entityName}</h3>
        <div id='button-div'></div>
        <table >
        <thead>
        <tr>
          <!-- Hidden Header Row -->
          <th style="width: 50%; visibility: hidden; height: 0; padding: 0; border: none;">Original Text</th>
          <th style="width: 50%; visibility: hidden; height: 0; padding: 0; border: none;">Translation</th>
        </tr>
      </thead>
      <tbody>
         <tr style='font-size:larger' >
              <td>${passageText}</td>
              <td>${translation}</td>
          </tr>
      </tbody>
        </table>
        <br/>
      `;
      if (wisskiPageURL) {
        document.getElementById('button-div').innerHTML += `
           &nbsp; &nbsp; &nbsp; <a href="${wisskiPageURL}" target="_blank">View on WissKI</a></p>
        `;
      }

      
      
    }

    function copyURI() {
      if (!uri) {
        alert('No URI to copy.');
        return;
      }

      let decodedURI;
      try {
        decodedURI = decodeURIComponent(uri);
      } catch (e) {
        alert('Invalid URI encoding.');
        return;
      }

      navigator.clipboard.writeText(decodedURI)
        .then(() => {
          const status = document.getElementById('copy-status');
          status.style.display = 'inline';
          setTimeout(() => {
            status.style.display = 'none';
          }, 2000);
        })
        .catch(err => {
          alert('Failed to copy URI: ' + err.message);
        });
    }



    // --- Chunks and concepts ---
    // Query the SPARQL endpoint for text chunks linked to the current entity and their concepts.
    async function fetchChunksAndConcepts(page) {
      const offset = (page - 1) * pageSize;
      
      // 1. Construct the Query String
      const query = `
        SELECT (GROUP_CONCAT(DISTINCT ?conceptLabel; SEPARATOR=", ") AS ?concepts) 
              (GROUP_CONCAT(DISTINCT ?conceptClassLabel; SEPARATOR=", ") AS ?conceptClasses) 
              (MAX(?chunk) AS ?chunkText) 
              ?chunkUri 
              ?textUri
        WHERE {
          BIND (<${uri}> AS ?textUri)
          ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                  <http://www.cidoc-crm.org/cidoc-crm/P165> ?chunkUri.
          ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P190> ?chunk;
                    <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUriFilter.
          ?conceptUriFilter <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabelFilter.
          
          OPTIONAL {
            ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUri. 
            ?conceptUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabel;
                      a <https://sdhss.org/ontology/sources-information-metadata/C20>.
          }
          OPTIONAL {
            ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptClassUri. 
            ?conceptClassUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptClassLabel;
                        a <https://sdhss.org/ontology/sources-information-metadata/C21>.
          }
        }
        GROUP BY ?textUri ?chunkUri
        ORDER BY ?textUri ?chunkUri
        LIMIT ${pageSize}
        OFFSET ${offset}
      `;

      //console.log(query);


      const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(`SPARQL error: ${response.status} ${response.statusText}\n${text}`);
        }

        const data = await response.json();

        if (!data.results || !data.results.bindings) {
          throw new Error('Invalid SPARQL JSON response');
        }

      // console.log(data);



      // Process Data
      
      return data.results.bindings.map(binding => ({
        textUri: binding.textUri?.value || '',
        concepts: binding.concepts?.value || 'N/A',
        conceptClasses: binding.conceptClasses?.value || 'N/A',
        chunk: binding.chunkText?.value || 'N/A',
        chunkUri: binding.chunkUri?.value || ''
        }));

       

}

    // new 
    // Render the chunk-and-concepts table into the page.
function renderChunksTable(rows) {
  const container = document.getElementById('table-chunks');
  
  if (!rows || rows.length === 0) {
    container.innerHTML = '<p>No chunks found.</p>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th style="width: 50%;">Chunk</th>
          <th style="width: 25%;">Concepts</th>
          <th style="width: 25%;"">Concept Classes</th>
        </tr>
      </thead>
      <tbody>
  `;

  rows.forEach(row => {
    let chunkDisplay = row.chunk;

    // If chunkUri is a valid URL, make the chunk text clickable
    if (row.chunkUri && row.chunkUri.startsWith('http')) {
      let href = row.chunkUri;
      
      // If it's an internal resource, link to instance-page.html
      if (row.chunkUri.startsWith('https://humility.lod4hss.cloud/resource/')) {
        href = `./instance-page.html?uri=${encodeURIComponent(row.chunkUri)}`;
      }

      chunkDisplay = `<a href="${href}" target="_blank">${row.chunk}</a>`;
    }

    // Handle cases where concepts might be missing
    const conceptsDisplay = row.concepts || 'N/A';
    const conceptClassesDisplay = row.conceptClasses || 'N/A';

    html += `
      <tr>
        <td>${chunkDisplay}</td>
        <td>${conceptsDisplay}</td>
        <td>${conceptClassesDisplay}</td>
      </tr>
    `;
  });

  html += '</tbody></table><div id="final-links"></div>';


  container.innerHTML = html;

  const finalLinksDiv = document.getElementById('final-links');



    // 4. Populate Final Links
  if (finalLinksDiv) {
    finalLinksDiv.innerHTML = `
      <p style="margin-top: 10px;">
        <span style="display: inline-block; margin-right: 15px;">
            <a href="./chunk-table.html">Back to chunks' list</a>
        </span>
        <span style="display: inline-block;">
            <a href="./instance-page.html?uri=${textUri}" target="_blank">Text Triples</a>
        </span>
      </p>  
    `;
  } else {
    console.error("Could not find 'final-links' div after rendering header.");
  }      
}



    // --- Separate Pagination State ---
    let currentPageChunks = 1;




    // --- Render Pagination for Outgoing ---
    function renderPaginationChunk(hasMore) {
      const pagination = document.getElementById('pagination-chunks');

      if (!pagination) return; // Safety check

      // Clear previous content
      pagination.innerHTML = '';
      
      let html = '';

      if (currentPageChunks > 1) {
        html += '<button onclick="goToPageChunks(1)">First</button>';
        html += `<button onclick="goToPageChunks(${currentPageChunks - 1})">Previous</button>`;
      }

      if (hasMore) {
        html += `<button onclick="goToPageChunks(${currentPageChunks + 1})">Next</button>`;
      }

      pagination.innerHTML = html;
    }



      // --- Go to Page for Chunks ---
    async function goToPageChunks(page) {
      currentPageChunks = page;
      try {
        const rows = await fetchChunksAndConcepts(page); 
        renderChunksTable(rows, 'chunks-table');
        renderPaginationOutgoing(rows.length === pageSize);
      } catch (err) {
        document.getElementById('chunks-table').innerHTML =
          `<p style="color:red;">Error: ${err.message}</p>`;
        document.getElementById('pagination-chunks').innerHTML = '';
      }
    }


    // --- Initial Load ---
    (async () => {
      await fetchEntityInfo();
      goToPageChunks(1)
    })();

  </script>
</body>

</html>

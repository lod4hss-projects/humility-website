<!DOCTYPE html>
<html>

<head>
  <title>Humility-Text</title>
  <link rel="stylesheet" href="base_style.css">

  <!-- manages the enpoint address in just one same place-->

<body>
  <div class="entity-header" id="entity-header"></div>
  
  <div id="table-chunks"></div>
  
  <div id="pagination-chunks"></div>

  <div id="tables-container">
    <div id="outoing-section">
      <h3>Instance Properties</h3>
      <div id="outgoing-table"></div>
      <div class="pagination" id="pagination-outgoing"></div>
    </div>
    <div id="incoming-section">
      <h3>Incoming Properties</h3>
      <div id="incoming-table"></div>
      <div class="pagination" id="pagination-incoming"></div>
    </div>
  </div>
  <div class="pagination" id="pagination"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uri = urlParams.get('uri');
    const decodedURI = decodeURIComponent(uri);

    const endpoint = address;
    const dataGraph = ' GRAPH <https://humility.lod4hss.cloud/resource/>'
    const ontologyGraph = ''
    const originatesFromGraph = 'GRAPH <https://humility.lod4hss.cloud/resource/originatesFrom>'
    const baseFieldsGraph = 'GRAPH <https://humility.lod4hss.cloud/resource/baseFields>'



    if (!uri) {
      document.body.innerHTML = '<p>Error: Missing ?uri parameter.</p>';
      throw new Error('Missing ?uri parameter');
    }

    const pageSize = 10;
    let currentPage = 1;
    let entityName = 'Unknown Entity';
    let entityClass = 'Unknown Class';
    let entityBirthYear = ''

    // this function converts the URI to the elites suisses website URLs
    // according to the class: p, g etc.
    function convertEntityURI(uri) {
      if (typeof uri !== 'string') return null;

      // Pattern 1: pXXXXX → /p/XXXXX
      const pMatch = uri.match(/^https:\/\/humility.lod4hss.cloud\/resource\/([0-9a-f]+)$/)

      // Unknown pattern
      console.warn('URI does not match known patterns:', uri);
      return null;
    }

    // this functions gets the data to write the entity header
    // and builds the correspondent HTML code
    async function fetchEntityInfo() {
      const query = `
      SELECT  ?expressionLabel ?textUri ?text ?translationUri ?translation ?wisskiPageURL
        WHERE {
            BIND( <${uri}> as ?textUri)
            ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                <http://www.cidoc-crm.org/cidoc-crm/P190> ?text;
                <http://www.w3.org/2002/07/owl#sameAs> ?wisskiPageURL.
                
            ## filter that excludes translations and other linguistic objects
            ?expression <http://www.cidoc-crm.org/cidoc-crm/P165> ?textUri;
                a <http://iflastandards.info/ns/lrm/lrmoo/F2>;
                <https://sdhss.org/ontology/shortcuts/P9> ?expressionLabel.
                
            OPTIONAL{
                 <${uri}> <http://www.cidoc-crm.org/cidoc-crm/P73> ?translationUri.
                ?translationUri    <http://www.cidoc-crm.org/cidoc-crm/P190> ?translation.
            }
        }
        LIMIT 1
      `;

      const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/sparql-results+json' }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`Entity info error: ${response.status} ${response.statusText}\n${text}`);
      }

      const data = await response.json();
      const bindings = data.results.bindings;

      if (bindings.length > 0) {
        entityName = bindings[0].expressionLabel?.value || entityName;
        passageText = bindings[0].text?.value || passageText;
        textUri = bindings[0].textUri?.value || textUri;
        wisskiPageURL = bindings[0].wisskiPageURL?.value || textUri;
        translationUri = bindings[0].translationUri?.value || translationUri;
        translation = bindings[0].translation?.value || translation;
      }

      // prepare the Elites Suisses website URL 
      const publicUrl = convertEntityURI(uri);

      // add the entity header 
      // it also adds a button to copy the URL and a link to the Elites Suisses website
      document.getElementById('entity-header').innerHTML = `
        <h3>${entityName}</h3>
        <div id='button-div'></div>
        <table >
          <tr style='font-size:larger' >
              <td>${passageText}</td>
              <td>${translation}</td>
          </tr>
        </table>
        <br/>
      `;
      if (wisskiPageURL) {
        document.getElementById('button-div').innerHTML += `
           &nbsp; &nbsp; &nbsp; <a href="${wisskiPageURL}" target="_blank">View on WissKI</a></p>
        `;
      }
    }

    function copyURI() {
      if (!uri) {
        alert('No URI to copy.');
        return;
      }

      let decodedURI;
      try {
        decodedURI = decodeURIComponent(uri);
      } catch (e) {
        alert('Invalid URI encoding.');
        return;
      }

      navigator.clipboard.writeText(decodedURI)
        .then(() => {
          const status = document.getElementById('copy-status');
          status.style.display = 'inline';
          setTimeout(() => {
            status.style.display = 'none';
          }, 2000);
        })
        .catch(err => {
          alert('Failed to copy URI: ' + err.message);
        });
    }



async function executeAndRenderQuery(page) {
  const offset = (page - 1) * pageSize;
  
  // 1. Construct the Query String
  const query = `
    SELECT (GROUP_CONCAT(DISTINCT ?conceptLabel; SEPARATOR=", ") AS ?concepts) 
           (GROUP_CONCAT(DISTINCT ?conceptClassLabel; SEPARATOR=", ") AS ?conceptClasses) 
           (MAX(?chunk) AS ?chunkText) 
           ?chunkUri 
           ?textUri
    WHERE {
      BIND (<${uri}> AS ?textUri)
      ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
               <http://www.cidoc-crm.org/cidoc-crm/P165> ?chunkUri.
      ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P190> ?chunk;
                <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUriFilter.
      ?conceptUriFilter <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabelFilter.
      
      OPTIONAL {
        ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUri. 
        ?conceptUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabel;
                  a <https://sdhss.org/ontology/sources-information-metadata/C20>.
      }
      OPTIONAL {
        ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptClassUri. 
        ?conceptClassUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptClassLabel;
                     a <https://sdhss.org/ontology/sources-information-metadata/C21>.
      }
    }
    GROUP BY ?textUri ?chunkUri
    ORDER BY ?textUri ?chunkUri
    LIMIT ${pageSize}
    OFFSET ${offset}
  `;

    console.log(query);


    const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/sparql-results+json' }
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`SPARQL error: ${response.status} ${response.statusText}\n${text}`);
      }

      const data = await response.json();

            // Log total count
    console.log(`✅ Total rows fetched: ${data}`);


      if (!data.results || !data.results.bindings) {
        throw new Error('Invalid SPARQL JSON response');
      }


    // Process Data
    
    return data.results.bindings.map(binding => ({
      textUri: binding.textUri?.value || '',
      concepts: binding.concepts?.value || 'N/A',
      conceptClasses: binding.conceptClasses?.value || 'N/A',
      chunk: binding.chunkText?.value || 'N/A',
      chunkUri: binding.chunkUri?.value || ''
      }));


}

// provisoire
document.addEventListener('DOMContentLoaded', () => {
    console.log("Page loaded. Starting query..."); // Check if this appears
    executeAndRenderQuery(1); // <--- THIS TRIGGERS THE FUNCTION
});








// --- INITIALIZATION ---
// Call this when your page loads or when the user clicks a "Search" button
// executeAndRenderQuery(1);





    async function fetchOutgoingTriples(page) {
      const offset = (page - 1) * pageSize;
      const query = `
        SELECT ?p ?o ?pLabel ?oName WHERE {
         # ${dataGraph} 
         {
          BIND (<${uri}> AS ?s)
          ?s ?p ?o.
          MINUS { ${baseFieldsGraph} {?s ?p ?o }}
          MINUS { ${originatesFromGraph} {?s ?p ?o }}          
          OPTIONAL {?o <https://sdhss.org/ontology/shortcuts/P9> ?oName}
          OPTIONAL {?o <http://www.cidoc-crm.org/cidoc-crm/P190> ?oName}
          OPTIONAL {?p <http://www.w3.org/2000/01/rdf-schema#label> ?pLbl}
          BIND (COALESCE(?pLbl, 'Unknown Label') AS ?pLabel )
          FILTER (?p != <http://www.w3.org/1999/02/22-rdf-syntax-ns#type>)
        }
          }
        LIMIT ${pageSize}
        OFFSET ${offset}
      `;
 

      const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/sparql-results+json' }
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`SPARQL error: ${response.status} ${response.statusText}\n${text}`);
      }

      const data = await response.json();

      if (!data.results || !data.results.bindings) {
        throw new Error('Invalid SPARQL JSON response');
      }

      return data.results.bindings.map(binding => ({
        p: binding.p?.value || '',
        o: binding.o?.value || '',
        pLabel: binding.pLabel?.value || '',
        oName: binding.oName?.value || ''
      }));
    }


    async function fetchIncomingTriples(page) {
      const offset = (page - 1) * pageSize;
      const query = `
        SELECT ?s ?p ?pLabel ?sName WHERE {
         # ${dataGraph} 
         {
          BIND (<${uri}> AS ?o)
          ?s ?p ?o.
          MINUS { ${baseFieldsGraph} {?s ?p ?o }}
          MINUS { ${originatesFromGraph} {?s ?p ?o }}
          OPTIONAL {?s <http://www.w3.org/2000/01/rdf-schema#label> ?sLabel}
          OPTIONAL {?s <http://www.cidoc-crm.org/cidoc-crm/P190> ?sLabel}
          OPTIONAL {?s <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> ?sClass.
                ?sClass <http://www.w3.org/2000/01/rdf-schema#label> ?sClassLabel}
          BIND (COALESCE(?sLabel, ?sClassLabel, 'Unknown Label') AS ?sName )
          OPTIONAL {?p <http://www.w3.org/2000/01/rdf-schema#label> ?pLbl}
                    OPTIONAL {?p <http://www.w3.org/2000/01/rdf-schema#label> ?pLbl}
          BIND (COALESCE(?pLbl, 'Unknown Label') AS ?pLabel )
          FILTER (?p != <http://www.w3.org/1999/02/22-rdf-syntax-ns#type>)
          }
          }
        ORDER BY ?sName
        LIMIT ${pageSize}
        OFFSET ${offset}
      `;

      // const endpoint = ;

      const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/sparql-results+json' }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`SPARQL error (incoming): ${response.status} ${response.statusText}\n${text}`);
      }

      const data = await response.json();

      if (!data.results || !data.results.bindings) {
        throw new Error('Invalid SPARQL JSON response (incoming)');
      }

      return data.results.bindings.map(binding => ({
        s: binding.s?.value || '',
        p: binding.p?.value || '',
        pLabel: binding.pLabel?.value || '',
        sName: binding.sNae?.value || ''
      }));
    }

    function getPredicateLabel(uri) {
      if (!uri) return uri;
      const lastHash = uri.lastIndexOf('#');
      const lastSlash = uri.lastIndexOf('/');
      const pos = Math.max(lastHash, lastSlash);
      return pos > 0 ? uri.substring(pos + 1) : uri;
    }

    function renderOutgoingTable(triples) {
      const container = document.getElementById('outgoing-table');
      let html = `
        <table>
          <thead>
            <tr><th>Predicate</th><th>Object</th></tr>
          </thead>
          <tbody>
      `;
      triples.forEach(triple => {
        let objectDisplay = triple.o;

        // If object is a URL (starts with http)
        if (triple.o.startsWith('http')) {
          let href = triple.o;
          // If it's an internal resource, link to person-page.html
          if (triple.o.startsWith('https://humility.lod4hss.cloud/resource/')) {
            href = `./instance-page.html?uri=${encodeURIComponent(triple.o)}`;
          }

          const oLabel = triple.oName.length > 0 ? triple.oName : triple.o;
          objectDisplay = `<a href="${href}">${oLabel}</a>`;
        }

        // Format predicate as link with short label
        // const predURI = getPredicateLabel(triple.p);
        const predLink = `<a href="${triple.p}" target="_blank">${triple.pLabel}</a>`;
        //const predLink = `<span>${predURI}</span>`;

        html += `
          <tr>
             <td>${predLink}</td>
            <td>${objectDisplay}</td>
          </tr>
        `;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }


    function renderIncomingTable(triples) {
      const container = document.getElementById('incoming-table');
      let html = `
        <table>
          <thead>
            <tr><th>Subject</th><th>Predicate</th></tr>
          </thead>
          <tbody>
      `;
      triples.forEach(triple => {
        let subjectDisplay = triple.s;

        // If subject is a URL (starts with http)
        if (triple.s.startsWith('http')) {
          let href = triple.s;
          // If it's an internal resource, link to person-page.html
          if (triple.s.startsWith('https://humility.lod4hss.cloud/resource/')) {
            href = `./instance-page.html?uri=${encodeURIComponent(triple.s)}`;
          }

          const sLabel = triple.sName.length > 0 ? triple.sName : triple.s;
          subjectDisplay = `<a href="${href}">${sLabel}</a>`;
        }

        // Format predicate as link with short label
        // const predLabel = getPredicateLabel(triple.p);
        const predLink = `<a href="${triple.p}" target="_blank">${triple.pLabel}</a>`;
        // const predLink = `<span>${predLabel}</span>`;

        html += `
          <tr>
            <td>${subjectDisplay}</td>
            <td>${predLink}</td>
          </tr>
        `;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // --- Separate Pagination State ---
    let currentPageOutgoing = 1;
    let currentPageIncoming = 1;

    // --- Render Pagination for Outgoing ---
    function renderPaginationOutgoing(hasMore) {
      const pagination = document.getElementById('pagination-outgoing');
      let html = '';

      if (currentPageOutgoing > 1) {
        html += '<button onclick="goToPageOutgoing(1)">First</button>';
        html += `<button onclick="goToPageOutgoing(${currentPageOutgoing - 1})">Previous</button>`;
      }

      if (hasMore) {
        html += `<button onclick="goToPageOutgoing(${currentPageOutgoing + 1})">Next</button>`;
      }

      pagination.innerHTML = html;
    }

    // --- Render Pagination for Incoming ---
    function renderPaginationIncoming(hasMore) {
      const pagination = document.getElementById('pagination-incoming');
      let html = '';

      if (currentPageIncoming > 1) {
        html += '<button onclick="goToPageIncoming(1)">First</button>';
        html += `<button onclick="goToPageIncoming(${currentPageIncoming - 1})">Previous</button>`;
      }

      if (hasMore) {
        html += `<button onclick="goToPageIncoming(${currentPageIncoming + 1})">Next</button>`;
      }

      pagination.innerHTML = html;
    }

    // --- Go to Page for Outgoing ---
    async function goToPageOutgoing(page) {
      currentPageOutgoing = page;
      try {
        const triples = await fetchOutgoingTriples(page, 'outgoing'); // or your existing fetchTriples()
        renderOutgoingTable(triples, 'outgoing-table');
        renderPaginationOutgoing(triples.length === pageSize);
      } catch (err) {
        document.getElementById('outgoing-table').innerHTML =
          `<p style="color:red;">Error: ${err.message}</p>`;
        document.getElementById('pagination-outgoing').innerHTML = '';
      }
    }

    // --- Go to Page for Incoming ---
    async function goToPageIncoming(page) {
      currentPageIncoming = page;
      try {
        const triples = await fetchIncomingTriples(page, 'incoming'); // or your fetchIncomingTriples()
        renderIncomingTable(triples); // or renderTable(triples, 'incoming-table') if unified
        renderPaginationIncoming(triples.length === pageSize);
      } catch (err) {
        document.getElementById('incoming-table').innerHTML =
          `<p style="color:red;">Error: ${err.message}</p>`;
        document.getElementById('pagination-incoming').innerHTML = '';
      }
    }

    // --- Initial Load ---
    (async () => {
      await fetchEntityInfo();
      goToPageOutgoing(1);
      goToPageIncoming(1);
    })();

  </script>

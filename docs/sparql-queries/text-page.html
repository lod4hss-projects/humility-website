<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humility-Text Details</title>
  <link rel="stylesheet" href="base_style.css">
  <script src="address.js"></script>

  <style>
    /* --- Clean Layout CSS --- */
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #fff;
      color: #333;
    }

    h1, h2, h3 {
      color: #333;
    }

    /* Header Section Styling */
    #entity-header {
      margin-bottom: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    #entity-header table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      background: white;
    }

    #entity-header td {
      padding: 15px;
      border: 1px solid #eee;
      vertical-align: top;
      width: 50%;
      font-size: 1.1em;
      line-height: 1.5;
    }

    #entity-header th {
      background: #e9ecef;
      padding: 10px;
      text-align: left;
      font-weight: bold;
    }

    /* Dashboard Layout for Table */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 70vh; /* Fixed height for scrollable table */
    }

    .table-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .table-header {
      padding: 15px;
      border-bottom: 1px solid #eee;
      background: #f8f9fa;
      border-radius: 8px 8px 0 0;
    }

    #table-chunks {
      flex: 1;
      overflow-y: auto; /* Scrollable content */
      padding: 0;
    }

    /* Table Styling */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }

    table.data-table th, 
    table.data-table td {
      text-align: left;
      padding: 10px 15px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    table.data-table th {
      background-color: #f8f9fa;
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: bold;
      color: #333;
    }

    table.data-table tr:hover {
      background-color: #f1f1f1;
    }

    table.data-table td:first-child {
      width: 50%;
      font-family: serif; /* Better for reading text chunks */
    }

    /* Links */
    a {
      color: #0056b3;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
      color: #003d80;
    }

    /* Pagination */
    .pagination {
      margin-top: 10px;
      display: flex;
      gap: 5px;
      justify-content: center;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #eee;
    }

    .pagination button {
      padding: 5px 12px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .pagination button:hover {
      background: #e9ecef;
    }

    .pagination button.active {
      background: #0056b3;
      color: white;
      border-color: #0056b3;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Bottom Navigation */
    .nav-links {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background: #f8f9fa;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .nav-links span {
      margin: 0 15px;
      display: inline-block;
    }
  </style>
</head>

<body>

  <!-- Entity Header Section -->
  <div id="entity-header">Loading entity information...</div>
  
  <!-- Dashboard Table Section -->
  <div class="dashboard">
    <div class="table-section">
      <div class="table-header">
        <h3 style="margin:0;">Associated Chunks</h3>
      </div>
      <div id="table-chunks">Loading chunks...</div>
      <div class="pagination" id="pagination-chunks"></div>
    </div>
  </div>

  <!-- Bottom Navigation Links -->
  <div class="nav-links" id="final-links">
    <!-- Links injected via JS -->
  </div>

  <script>
    // --- Configuration & State ---
    const urlParams = new URLSearchParams(window.location.search);
    const uri = urlParams.get('uri');
    const endpoint = address;
    
    if (!uri) {
      document.body.innerHTML = '<p style="color:red; padding:20px;">Error: Missing ?uri parameter.</p>';
      throw new Error('Missing ?uri parameter');
    }

    let entityName = 'Unknown Entity';
    let passageText = 'N/A';
    let translation = 'N/A';
    let textUriGlobal = '';
    let wisskiPageURL = '';

    // Data State
    let allChunksData = []; 
    const ITEMS_PER_PAGE = 20;
    let currentPageChunks = 1;

    // DOM Elements
    const tableContainer = document.getElementById('table-chunks');
    const paginationContainer = document.getElementById('pagination-chunks');
    const finalLinksDiv = document.getElementById('final-links');

    // --- 1. Fetch Entity Header Info ---
    async function fetchEntityInfo() {
      const query = `
      SELECT  ?expressionLabel ?textUri ?text ?translationUri ?translation ?wisskiPageURL
        WHERE {
            BIND( <${uri}> as ?textUri)
            ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                <http://www.cidoc-crm.org/cidoc-crm/P190> ?text;
                <http://www.w3.org/2002/07/owl#sameAs> ?wisskiPageURL.
            ?expression <http://www.cidoc-crm.org/cidoc-crm/P165> ?textUri;
                a <http://iflastandards.info/ns/lrm/lrmoo/F2>;
                <https://sdhss.org/ontology/shortcuts/P9> ?expressionLabel.
            OPTIONAL{
                 <${uri}> <http://www.cidoc-crm.org/cidoc-crm/P73> ?translationUri.
                ?translationUri    <http://www.cidoc-crm.org/cidoc-crm/P190> ?translation.
            }
        }
        LIMIT 1
      `;

      try {
        const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        if (!response.ok) throw new Error(`Entity info error: ${response.status}`);
        
        const data = await response.json();
        const bindings = data.results.bindings;

        if (bindings.length > 0) {
          entityName = bindings[0].expressionLabel?.value || entityName;
          passageText = bindings[0].text?.value || passageText;
          textUriGlobal = bindings[0].textUri?.value || uri;
          wisskiPageURL = bindings[0].wisskiPageURL?.value || '';
          translation = bindings[0].translation?.value || 'No translation available';
        }

        // Render Header
        let headerHTML = `
          <h2>${entityName}</h2>
          <div style="margin-bottom:10px;">
            ${wisskiPageURL ? `<a href="${wisskiPageURL}" target="_blank" style="font-weight:bold;">View on WissKI</a>` : ''}
          </div>
          <table>
            <thead>
              <tr>
                <th>Original Text</th>
                <th>Translation</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${passageText}</td>
                <td>${translation}</td>
              </tr>
            </tbody>
          </table>
        `;
        document.getElementById('entity-header').innerHTML = headerHTML;

        // Render Bottom Links
        finalLinksDiv.innerHTML = `
          <span><a href="./chunk-table.html">← Back to chunks' list</a></span>
          <span><a href="./instance-page.html?uri=${encodeURIComponent(textUriGlobal)}" target="_blank">View Text Triples</a></span>
        `;

      } catch (err) {
        document.getElementById('entity-header').innerHTML = `<p style="color:red">Error loading header: ${err.message}</p>`;
      }
    }

    // --- 2. Fetch Chunks Data ---
    async function fetchChunksData() {
      // Fetch up to 500 items to allow pagination without complex SPARQL offsets
      const query = `
        SELECT (GROUP_CONCAT(DISTINCT ?conceptLabel; SEPARATOR=", ") AS ?concepts) 
              (GROUP_CONCAT(DISTINCT ?conceptClassLabel; SEPARATOR=", ") AS ?conceptClasses) 
              (MAX(?chunk) AS ?chunkText) 
              ?chunkUri 
              ?textUri
        WHERE {
          BIND (<${uri}> AS ?textUri)
          ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                  <http://www.cidoc-crm.org/cidoc-crm/P165> ?chunkUri.
          ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P190> ?chunk;
                    <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUriFilter.
          ?conceptUriFilter <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabelFilter.
          
          OPTIONAL {
            ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUri. 
            ?conceptUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabel;
                      a <https://sdhss.org/ontology/sources-information-metadata/C20>.
          }
          OPTIONAL {
            ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptClassUri. 
            ?conceptClassUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptClassLabel;
                        a <https://sdhss.org/ontology/sources-information-metadata/C21>.
          }
        }
        GROUP BY ?textUri ?chunkUri
        ORDER BY ?chunkUri
        LIMIT 500
      `;

      try {
        const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        if (!response.ok) throw new Error(`SPARQL error: ${response.status}`);

        const data = await response.json();
        
        allChunksData = data.results.bindings.map(binding => ({
          textUri: binding.textUri?.value || '',
          concepts: binding.concepts?.value || '',
          conceptClasses: binding.conceptClasses?.value || '',
          chunk: binding.chunkText?.value || '',
          chunkUri: binding.chunkUri?.value || ''
        }));

        renderTable();
        renderPagination();

      } catch (err) {
        tableContainer.innerHTML = `<p style="color:red; padding:20px;">Error loading chunks: ${err.message}</p>`;
      }
    }

    // --- 3. Render Table ---
    function renderTable() {
      const startIndex = (currentPageChunks - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageData = allChunksData.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tableContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No chunks found.</div>';
        return;
      }

      let html = `<table class="data-table">
        <thead>
          <tr>
            <th>Chunk Content</th>
            <th>Concepts</th>
            <th>Concept Classes</th>
          </tr>
        </thead>
        <tbody>`;

      pageData.forEach(row => {
        let chunkDisplay = row.chunk;
        if (row.chunkUri && row.chunkUri.startsWith('http')) {
          const href = row.chunkUri.startsWith('https://humility.lod4hss.cloud/resource/') 
            ? `./instance-page.html?uri=${encodeURIComponent(row.chunkUri)}` 
            : row.chunkUri;
          chunkDisplay = `<a href="${href}" target="_blank">${row.chunk}</a>`;
        }

        html += `
          <tr>
            <td>${chunkDisplay}</td>
            <td>${row.concepts || '<span style="color:#999">-</span>'}</td>
            <td>${row.conceptClasses || '<span style="color:#999">-</span>'}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      tableContainer.innerHTML = html;
    }

    // --- 4. Render Pagination ---
    function renderPagination() {
      const totalPages = Math.ceil(allChunksData.length / ITEMS_PER_PAGE);
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      // Prev Button
      const prevBtn = document.createElement('button');
      prevBtn.textContent = '← Prev';
      prevBtn.disabled = currentPageChunks === 1;
      prevBtn.onclick = () => { currentPageChunks--; renderTable(); renderPagination(); };
      paginationContainer.appendChild(prevBtn);

      // Page Numbers
      const maxVisible = 5;
      let start = Math.max(1, currentPageChunks - Math.floor(maxVisible/2));
      let end = Math.min(totalPages, start + maxVisible - 1);
      if (end - start + 1 < maxVisible) start = Math.max(1, end - maxVisible + 1);

      for (let i = start; i <= end; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPageChunks) btn.classList.add('active');
        btn.onclick = () => { currentPageChunks = i; renderTable(); renderPagination(); };
        paginationContainer.appendChild(btn);
      }

      // Next Button
      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Next →';
      nextBtn.disabled = currentPageChunks === totalPages;
      nextBtn.onclick = () => { currentPageChunks++; renderTable(); renderPagination(); };
      paginationContainer.appendChild(nextBtn);
    }

    // --- Initial Load ---
    (async () => {
      await fetchEntityInfo();
      await fetchChunksData();
    })();

  </script>
</body>
</html>

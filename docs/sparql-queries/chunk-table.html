<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humility-Chunks</title>
  <link rel="stylesheet" href="./base_style.css">

  <!-- manages the enpoint address in just one same place-->
  <script src="address.js"></script>

</head>

<body>
  <div>
    <h1>Annotated Chunks</h1>
    <input type="text" id="searchInput" value="Humility">
    <div id="tableContainer">Loading data...</div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>

    // gets endpoint address from one single source
    const endpoint = address;
    const ITEMS_PER_PAGE = 10;
    let allData = [];
    let currentPage = 1;
    let filteredData = [];
    let currentSearchTerm = 'Humility';

    const searchInput = document.getElementById('searchInput');
    const tableContainer = document.getElementById('tableContainer');
    const paginationContainer = document.getElementById('pagination');

    function convertEntityURI(uri) {
      const match = uri.match(/^https:\/\/humility.lod4hss.cloud\/resource\/i(\d+)$/);
      if (!match) {
        return null;
      }

    }

    async function fetchData(searchTerm = '') {
      const filterClause = searchTerm ? `FILTER(CONTAINS(LCASE(?conceptLabelFilter), LCASE("${searchTerm}")))` : '';
      const query = `
        prefix owl: <http://www.w3.org/2002/07/owl#>
        prefix xsd: <http://www.w3.org/2001/XMLSchema#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        prefix crm: <http://www.cidoc-crm.org/cidoc-crm/>
        prefix sdh-short: <https://sdhss.org/ontology/shortcuts/>
        PREFIX onto: <https://ontome.net/ontology/>

        SELECT ?concepts ?chunk ?textUri ?chunkUri 
        WHERE {
        {
          SELECT (GROUP_CONCAT(?conceptLabel; SEPARATOR=", ") AS ?concepts) (max(?chunk) as ?chunk) ?textUri ?chunkUri 
          WHERE {
              ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                  <http://www.cidoc-crm.org/cidoc-crm/P165> ?chunkUri.
              ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P190> ?chunk.
              ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUriFilter.
              ?conceptUriFilter <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabelFilter
              optional {?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUri.
              ?conceptUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabel}
          ${filterClause}

          }
          group by ?textUri ?chunkUri 
          order by ?textUri ?chunkUri 
          limit 100          
          }

    
          }
         
    
      `;

      try {
        const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        const data = await response.json();
        allData = data.results.bindings.map(row => ({
          // uri: row.conceptUri?.value || '#',
          name: row.concepts?.value || 'N/A',
          chunk: row.chunk?.value || 'N/A',
          chunkUri: row.chunkUri?.value || 'N/A',
          textUri: row.textUri?.value || 'N/A'
        }));
        filteredData = [...allData];
        renderTable();
        renderPagination();
      } catch (error) {
        tableContainer.innerHTML = `<div>No results or error: ${error.message}</div>`;
      }
    }

    function renderTable() {
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageData = filteredData.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tableContainer.innerHTML = '<div>No results found.</div>';
        return;
      }



      let tableHTML = `<br/>
      <table><thead><tr><th>Concepts</th><th>Chunk</th><th>Card</th></tr></thead><tbody>`;
      pageData.forEach(row => {
        tableHTML += `<tr><td>${escapeHtml(row.name)}</td>
          <td><a href="./instance-page.html?uri=${escapeHtml(row.chunkUri)}" target="_blank">${escapeHtml(row.chunk)}</a></td>
          <td><a href="./text-page.html?uri=${escapeHtml(row.textUri)}" target="_blank">View</a></td></tr>`;
      });
      tableHTML += `</tbody></table>`;
      tableContainer.innerHTML = tableHTML;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevButton = document.createElement('button');
      prevButton.textContent = '← Previous';
      prevButton.disabled = currentPage === 1;
      prevButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(prevButton);

      for (let i = 1; i <= totalPages; i++) {
        const pageButton = document.createElement('button');
        pageButton.textContent = i;
        if (i === currentPage) pageButton.classList.add('active');
        pageButton.addEventListener('click', () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        paginationContainer.appendChild(pageButton);
      }

      const nextButton = document.createElement('button');
      nextButton.textContent = 'Next →';
      nextButton.disabled = currentPage === totalPages;
      nextButton.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(nextButton);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    searchInput.addEventListener('input', () => {
      currentSearchTerm = searchInput.value.trim();
      fetchData(currentSearchTerm);
    });

    // Trigger initial load with default value
    fetchData(currentSearchTerm);
  </script>
</body>

</html>

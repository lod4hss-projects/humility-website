<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humility-Chunks</title>
  <link rel="stylesheet" href="./base_style.css">
  <script src="address.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      min-width: 200px;
      flex: 1;
    }

    .control-group label {
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    /* Layout for Table and potential future sidebar */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 80vh;
    }

    .table-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .table-header {
      padding: 15px;
      border-bottom: 1px solid #eee;
      background: #f8f9fa;
      border-radius: 8px 8px 0 0;
    }

    #tableContainer {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9em;
    }

    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    th {
      background-color: #f8f9fa;
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: bold;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    /* Link styling */
    a {
      color: #0056b3;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
      color: #003d80;
    }

    .pagination {
      margin-top: 10px;
      display: flex;
      gap: 5px;
      justify-content: center;
      padding: 10px;
    }

    .pagination button {
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 3px;
    }

    .pagination button.active {
      background: #0056b3;
      color: white;
      border-color: #0056b3;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h1>Annotated Chunks</h1>
  
  <!-- Controls Section -->
  <div class="controls">
    <div class="control-group">
      <label for="searchInput">Filter Concept Name:</label>
      <input type="text" id="searchInput" value="" placeholder="Type concept name...">
    </div>
    <div class="control-group">
      <label for="classFilterInput">Filter Concept Class:</label>
      <input type="text" id="classFilterInput" value="" placeholder="e.g. Virtue, Emotion">
    </div>
    <div class="control-group">
      <label for="chunkInput">Filter Chunk:</label>
      <input type="text" id="chunkInput" value="" placeholder="Type chunk text...">
    </div>
    <div class="control-group">
      <label for="textLabelInput">Filter Text Label:</label>
      <input type="text" id="textLabelInput" value="" placeholder="Type text title...">
    </div>
  </div>

  <!-- Dashboard Section -->
  <div class="dashboard">
    <div class="table-section">
      <div class="table-header">
        <h3 style="margin:0;">Chunk List</h3>
      </div>
      <div id="tableContainer">Loading data...</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const endpoint = address;
    const ITEMS_PER_PAGE = 20;
    
    let allData = []; 
    let filteredData = []; 
    let currentPage = 1;

    const searchInput = document.getElementById('searchInput');
    const classFilterInput = document.getElementById('classFilterInput');
    const chunkInput = document.getElementById('chunkInput');
    const textLabelInput = document.getElementById('textLabelInput');
    const tableContainer = document.getElementById('tableContainer');
    const paginationContainer = document.getElementById('pagination');

    async function fetchData() {
      // We fetch a broad dataset based on the main concept search to keep SPARQL simple,
      // then apply specific Class and Text Label filters locally in JS for speed and flexibility.
      const searchTerm = searchInput.value.trim();
      const nameFilter = searchTerm ? `FILTER(CONTAINS(LCASE(?conceptLabelFilter), LCASE("${searchTerm}")))` : '';
      
      const query = `
        prefix owl: <http://www.w3.org/2002/07/owl#>
        prefix xsd: <http://www.w3.org/2001/XMLSchema#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        prefix crm: <http://www.cidoc-crm.org/cidoc-crm/>
        prefix sdh-short: <https://sdhss.org/ontology/shortcuts/>
        PREFIX onto: <https://ontome.net/ontology/>

        SELECT (GROUP_CONCAT(DISTINCT ?conceptLabel; SEPARATOR=", ") AS ?concepts) 
          (GROUP_CONCAT(DISTINCT ?conceptClassLabel; SEPARATOR=", ") AS ?conceptClasses) 
          (max(?chunk) as ?chunkText) ?textUri ?textLabel ?chunkUri 
          WHERE {
              ?textUri a <http://www.cidoc-crm.org/cidoc-crm/E33>;
                  <https://sdhss.org/ontology/shortcuts/P9> ?textLabel;
                  <http://www.cidoc-crm.org/cidoc-crm/P165> ?chunkUri.
              ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P190> ?chunk;
                  <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUriFilter.
              ?conceptUriFilter <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabelFilter
              optional {
                  ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptUri. 
                  ?conceptUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptLabel;
                           a <https://sdhss.org/ontology/sources-information-metadata/C20>.
                  }
              optional {
                  ?chunkUri <http://www.cidoc-crm.org/cidoc-crm/P67> ?conceptClassUri. 
                  ?conceptClassUri <https://sdhss.org/ontology/shortcuts/P9> ?conceptClassLabel;
                           a <https://sdhss.org/ontology/sources-information-metadata/C21>.}
          ${nameFilter}
          }
          group by ?textUri ?textLabel ?chunkUri 
          order by ?textUri ?chunkUri 
          limit 500
      `;

      try {
        const response = await fetch(endpoint + '?query=' + encodeURIComponent(query), {
          headers: { 'Accept': 'application/sparql-results+json' }
        });
        const data = await response.json();
        
        allData = data.results.bindings.map(row => ({
          textLabel: row.textLabel?.value || 'N/A',
          name: row.concepts?.value || 'N/A',
          conceptClasses: row.conceptClasses?.value || 'N/A',
          chunk: row.chunkText?.value || 'N/A',
          chunkUri: row.chunkUri?.value || 'N/A',
          textUri: row.textUri?.value || 'N/A'
        }));
        
        applyFilters();
        
      } catch (error) {
        tableContainer.innerHTML = `<div style="color:red">Error: ${error.message}</div>`;
        console.error(error);
      }
    }

    function applyFilters() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const classTerm = classFilterInput.value.trim().toLowerCase();
      const chunkTerm = chunkInput.value.trim().toLowerCase();
      const textTerm = textLabelInput.value.trim().toLowerCase();

      filteredData = allData.filter(item => {
        // Concept Name Filter
        const matchesName = searchTerm === '' || item.name.toLowerCase().includes(searchTerm);
        
        // Concept Class Filter
        const matchesClass = classTerm === '' || (item.conceptClasses && item.conceptClasses.toLowerCase().includes(classTerm));
      
        // Chunk Filter
        const matchesChunk = chunkTerm === '' || (item.chunk && item.chunk.toLowerCase().includes(chunkTerm));

        // Text Label Filter
        const matchesText = textTerm === '' || (item.textLabel && item.textLabel.toLowerCase().includes(textTerm));

        return matchesName && matchesClass && matchesChunk && matchesText;
      });

      currentPage = 1;
      renderTable();
      renderPagination();
    }

    function renderTable() {
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageData = filteredData.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tableContainer.innerHTML = '<div>No results found.</div>';
        return;
      }

      let tableHTML = `
      <table>
        <thead>
          <tr>
            <th>Concepts</th>
            <th>Classes</th>
            <th>Chunk</th>
            <th>Text</th>
          </tr>
        </thead>
        <tbody>`;
      
      pageData.forEach(row => {
        const chunkLink = `<a href="./instance-page.html?uri=${encodeURIComponent(row.chunkUri)}" target="_blank">${escapeHtml(row.chunk)}</a>`;
        const textLink = `<a href="./text-page.html?uri=${encodeURIComponent(row.textUri)}" target="_blank">${escapeHtml(row.textLabel)}</a>`;
        
        tableHTML += 
        `<tr>
          <td>${escapeHtml(row.name)}</td>
          <td>${escapeHtml(row.conceptClasses)}</td>
          <td>${chunkLink}</td>
          <td>${textLink}</td>
         </tr>`;
      });
      tableHTML += `</tbody></table>`;
      tableContainer.innerHTML = tableHTML;
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
      paginationContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevButton = document.createElement('button');
      prevButton.textContent = '← Prev';
      prevButton.disabled = currentPage === 1;
      prevButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(prevButton);

      const maxVisible = 5;
      let start = Math.max(1, currentPage - Math.floor(maxVisible/2));
      let end = Math.min(totalPages, start + maxVisible - 1);
      if (end - start + 1 < maxVisible) start = Math.max(1, end - maxVisible + 1);

      for (let i = start; i <= end; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.addEventListener('click', () => {
          currentPage = i;
          renderTable();
          renderPagination();
        });
        paginationContainer.appendChild(btn);
      }

      const nextButton = document.createElement('button');
      nextButton.textContent = 'Next →';
      nextButton.disabled = currentPage === totalPages;
      nextButton.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderTable();
          renderPagination();
        }
      });
      paginationContainer.appendChild(nextButton);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let debounceTimer;
    function triggerUpdate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        applyFilters();
      }, 300);
    }

    searchInput.addEventListener('input', triggerUpdate);
    classFilterInput.addEventListener('input', triggerUpdate);
    chunkInput.addEventListener('input', triggerUpdate);
    textLabelInput.addEventListener('input', triggerUpdate);

    // Initial Load
    fetchData();
  </script>
</body>
</html>
